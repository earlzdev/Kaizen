# Alembic config shared by every service — infra/migrations/alembic.ini
#
# The database URL and the versions directory are NOT here: env.py sets both
# from `-x service=<name>`, because five services keep five databases and five
# version chains behind one runner. Pointing this file at one of them would make
# the other four a copy-paste accident waiting to happen.
[alembic]
script_location = %(here)s
prepend_sys_path = ../..
# Revisions sort by filename, so a date prefix keeps them in the order they were
# written rather than by random hash.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
